[workspace]
resolver = "3"
default-members = ["crates/app"]
members = [
    "crates/core",
    "crates/providers",
    "crates/input",
    "crates/media",
    "crates/system",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bigpicture-core = { path = "crates/core" }
bigpicture-providers = { path = "crates/providers" }
bigpicture-input = { path = "crates/input" }
bigpicture-media = { path = "crates/media" }
bigpicture-system = { path = "crates/system" }

gpui-kit = { git = "https://github.com/longbridge/gpui-kit", branch = "main" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = "limited"

[profile.release]
strip = "symbols"
