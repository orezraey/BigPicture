[workspace]
resolver = "3"
default-members = ["crates/app"]
members = [
    "crates/core",
    "crates/providers",
    "crates/input",
    "crates/media",
    "crates/system",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bigpicture-core = { path = "crates/core" }
bigpicture-providers = { path = "crates/providers" }
bigpicture-input = { path = "crates/input" }
bigpicture-media = { path = "crates/media" }
bigpicture-system = { path = "crates/system" }

gpui-kit = { git = "https://github.com/longbridge/gpui-kit", branch = "main" }
gpui-fps = { git = "https://github.com/longbridge/gpui-kit", branch = "main" }

gstreamer = { git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main" }
gstreamer-app = { git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main" }
gilrs = { git = "https://gitlab.com/gilrs-project/gilrs", default-features = false, features = ["xinput"] }

anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "qoi"] }
serde_json = "1"
thiserror = "2"
tungstenite = "0.30"
ureq = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = "limited"

[profile.release]
strip = "symbols"
